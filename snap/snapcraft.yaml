name: retropod
version: 1.12.0
summary: Local Music Player Inspired by the iPod Classic
description: RetroPod is a lightweight, offline music player app that emulates the experience of the legendary iPod Classic. It supports local music playback, shuffle/repeat, custom playlists, cover art, and more — all in a nostalgic design.
icon: snap/gui/retropod.png
contact: mailto:adeeteya@gmail.com
source-code: https://github.com/RchrdAriza/RetroPod
issues: https://github.com/RchrdAriza/RetroPod/issues
license: MIT

confinement: strict
base: core22
grade: stable

slots:
  dbus-retropod:
    interface: dbus
    bus: session
    name: com.rchrdariza.retropod

apps:
  retropod:
    command: retropod
    extensions: [gnome]
    plugs:
      - audio-playback
      - removable-media
      - desktop
      - desktop-legacy
      - home
    slots:
      - dbus-retropod
parts:
  retropod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - git
      - libgtk-3-dev
      - liblzma-dev
      - ninja-build
      - pkg-config
    stage-packages:
      - mpv
      - libmpv1
      - libgtk-3-0
      - libglib2.0-0
      - libgdk-pixbuf-2.0-0
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libx11-6
      - libxkbcommon0
      - libwayland-client0
      - libegl1
      - libstdc++6
      - libsqlite3-0
      - liblzma5
      - libcurl4
      - libasound2
      - xdg-utils
      - ca-certificates
    override-pull: |
      snapcraftctl pull
      if [ ! -d flutter-sdk ]; then
        git clone https://github.com/flutter/flutter.git -b 3.44.7 flutter-sdk
      fi
    override-build: |
      export PATH=$PWD/flutter-sdk/bin:$PATH
      flutter pub get
      flutter gen-l10n
      flutter build linux --release --target lib/main.dart
      install -D build/linux/x64/release/bundle/retropod $CRAFT_PART_INSTALL/retropod
      cp -r build/linux/x64/release/bundle/* $CRAFT_PART_INSTALL/
